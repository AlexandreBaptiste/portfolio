<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background matching the portfolio's --color-bg -->
  <rect width="32" height="32" rx="5" fill="#0A0A0A"/>
  <!-- <AB> monogram: muted angle brackets, bold white initials -->
  <text
    x="16" y="22"
    font-family="'Courier New', Courier, monospace"
    font-size="13"
    font-weight="700"
    text-anchor="middle"
    fill="#FFFFFF"
  ><tspan fill="#666666">&lt;</tspan>AB<tspan fill="#666666">&gt;</tspan></text>
</svg>